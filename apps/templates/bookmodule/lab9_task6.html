{% extends "layouts/base.html" %}
{% block content %}
    <h2>Task 6: Filtered Books Count</h2>
    <hr>
    <ul>
        {% for pub in publishers %}
            <li><strong>{{ pub.name }}</strong> - Number of Filtered Books: {{ pub.filtered_books_count }}</li>
        {% empty %}
            <li>No publishers found.</li>
        {% endfor %}
    </ul>
{% endblock %}
